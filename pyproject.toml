[project]
name = "gnosis"
version = "0.1.0"
description = "Know thyself. Your fills already do. Behavioural profiling for trading agents, on Binance Agent OS."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
# The deterministic layer -- ingest, round-trip reconstruction, detectors,
# statistics, card, gate -- has NO dependencies at all. Not a stylistic
# preference: it is what lets a judge clone the repo and run every command in
# the README without pip, credentials, or a network.
dependencies = []

[project.optional-dependencies]
# The agent half: narration and the marginal pre-trade call.
agent = ["anthropic>=0.40"]
# Live adapters: Binance CEX history and the on-chain wallet.
live = ["httpx>=0.27"]
dev = ["ruff>=0.9"]

[project.scripts]
gnosis = "gnosis.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gnosis"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["corpus", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "S", "PL"]
ignore = [
    "PLR0912", "PLR0913", "PLR0915",  # detectors and the gate branch a lot; that is the job
    "PLR0911",                        # the gate returns a verdict per branch, by design
    "PLR2004",                        # statistical thresholds read better inline than named
    "S101",                           # asserts are how the test suites report
    "E501",                           # line length is the formatter's business
    "S311",                           # `random` is for corpus generation, never for security
]

[tool.ruff.lint.per-file-ignores]
# Test suites print rather than raise, and pack fixture setup onto one line.
"tests/*" = ["E402", "E702", "BLE001"]
"evals/*" = ["E402", "E702"]
